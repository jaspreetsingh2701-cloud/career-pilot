<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerPilot M5 local form fixture</title>
  </head>
  <body>
    <main>
      <h1>CareerPilot local form fixture</h1>
      <p>Use synthetic data only. This fixture is for explicit detection and approved-fill checks.</p>
      <form id="application-form">
        <label for="full-name">Full name</label>
        <input id="full-name" name="fullName" autocomplete="name" />
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" />
        <label for="location">Current location</label>
        <input id="location" name="location" />
        <label for="experience">Years of experience</label>
        <input id="experience" name="experience" type="number" />
        <label for="work-mode">Preferred work mode</label>
        <select id="work-mode" name="workMode">
          <option value="">Select a work mode</option>
          <option value="remote">Remote</option>
          <option value="hybrid">Hybrid</option>
          <option value="onsite">On-site</option>
        </select>
        <label for="cover-note">Additional information</label>
        <textarea id="cover-note" name="coverNote"></textarea>
        <label for="site-note">Pre-filled site value</label>
        <input id="site-note" name="siteNote" value="Keep this existing value" />
        <label for="password">Password (must be excluded)</label>
        <input id="password" name="password" type="password" />
        <label for="otp">One-time code (must be excluded)</label>
        <input id="otp" name="otp" autocomplete="one-time-code" />
        <button type="submit">Submit manually after review</button>
      </form>
    </main>
  </body>
</html>
